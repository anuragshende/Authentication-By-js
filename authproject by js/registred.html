<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login pages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
          
      <div class=" Registredcontainer">
                   <form class="registred" action="">
                             
                             <h1>Welcome  for Registration</h1>

                            
                               <div class="emails">
                                      <p>Email</p>
                           <input id="email"
                           
                    autocomplete="current-password"
                           type="email" placeholder="Enter the  email">
                               </div>

                               <div class="passwords">
                               <p>Confirm Password</p>
                                 <input id="password" 
                                 type="password"
                                   autocomplete="current-password"
                                 placeholder="Enter the Password">
                               </div>

                               <div class="submit">
                       
                        <button>Registred</button>
                         <p>Don't have a Account ? <a href="index.html">Login in </a></p>
                               </div>
                              
                        <p id="registermess"></p>

                      </form>
      </div>

    <script src="app.js"></script>
</body>
</html>
